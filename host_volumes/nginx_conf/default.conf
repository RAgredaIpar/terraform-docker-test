# /etc/nginx/conf.d/default.conf

# Round-robin entre las 3 apps
upstream backend_app {
    server app1:5678;
    server app2:5678;
    server app3:5678;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # pruebas
    location /health {
        return 200 "ok";
    }

    location /api {
        proxy_pass http://backend_app;
    }

    # Estaticos del proxy
    location /web {
        alias /usr/share/nginx/html;
        autoindex off;
        try_files $uri $uri/ =404;
    }
}